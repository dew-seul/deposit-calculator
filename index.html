<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>예약금 설정 — 공비서 원장님</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      background: #ffffff;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page-wrap {
      position: relative;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
    }
    .page-wrap img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
    }
    .calc-btn {
      position: absolute;
      top: 9.6%;
      right: 6.2%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      padding: 0 14px;
      background: #ffffff;
      color: #20232b;
      border: 1px solid #dfe0e1;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      letter-spacing: -0.01em;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .calc-btn:hover {
      background: #f0f6ff;
      border-color: #227eff;
      color: #227eff;
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <img src="./deposit-policy.png" alt="예약금 설정 페이지" />
    <button class="calc-btn" type="button" onclick="window.open('./calculator/', '_blank')">
      예약금 계산기
    </button>
  </div>
</body>
</html>
